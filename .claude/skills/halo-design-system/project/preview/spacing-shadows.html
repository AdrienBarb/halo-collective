<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing · Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:24px 20px;}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;}
.tile{background:var(--surface);border:1px solid var(--line);width:100px;height:64px;border-radius:12px;}
.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase;font-weight:600;}
.role{font-family:var(--font-sans);font-size:10px;color:var(--ink-3);text-align:center;line-height:1.4;}
.pill{width:48px;height:48px;border-radius:24px;background:var(--action);display:flex;align-items:center;justify-content:center;color:#fff;}</style></head>
<body><div class="wrap">
<div class="row">
  <div class="col"><div class="tile" style="box-shadow:0 8px 24px rgba(0,0,0,.10);"></div><div class="lab">card</div><div class="role">Roster hover<br>0 8 24 / .10</div></div>
  <div class="col"><div class="tile" style="border-radius:50%;width:64px;height:64px;box-shadow:0 6px 20px rgba(0,0,0,.22);"></div><div class="lab">portrait</div><div class="role">Avatar circle<br>0 6 20 / .22</div></div>
  <div class="col"><div class="pill" style="box-shadow:0 6px 20px rgba(0,0,0,.45);">▶</div><div class="lab">pill</div><div class="role">Play over media<br>0 6 20 / .45</div></div>
</div>
</div></body></html>
