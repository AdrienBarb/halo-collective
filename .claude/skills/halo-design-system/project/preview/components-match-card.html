<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Match card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:14px 20px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.b{width:26px;height:26px;border-radius:8px;background:#7a1f1f;color:#fff;font-family:var(--font-mono);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.opp{font-family:var(--font-sans);font-weight:600;font-size:13px;color:var(--ink);}
.opp small{font-family:var(--font-mono);font-weight:500;font-size:10px;color:var(--ink-3);}
.score{font-family:var(--font-mono);font-weight:700;font-size:24px;letter-spacing:.04em;margin:10px 0 4px;color:var(--ink);font-variant-numeric:tabular-nums;}
.notes{font-family:var(--font-sans);font-size:12px;line-height:1.5;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.btn{background:var(--action);color:#fff;font-family:var(--font-mono);font-weight:900;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 16px;border:0;border-radius:4px;margin-top:10px;display:inline-flex;align-items:center;gap:7px;}</style></head>
<body><div class="wrap">
<div class="card">
  <div class="head"><div class="b">L</div><div class="meta">SF · 24 APR</div></div>
  <div class="opp">Jannik Sinner <small>#1 · 🇮🇹</small></div>
  <div class="score">3‑6, 4‑6</div>
  <p class="notes">Closer than the score. Returned big on second serves but couldn't break in the set‑two tiebreak. Onwards to Munich.</p>
  <button class="btn"><span style="font-size:9px;">▶</span> Watch highlights →</button>
</div>
</div></body></html>
