<!doctype html>
<html><head><meta charset="utf-8"><title>Color · Core palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .wrap{padding:18px 20px;font-family:var(--font-sans);}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .swatch{display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:8px;border:1px solid var(--line);}
  .name{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em;}
</style></head><body><div class="wrap">
<div class="row">
  <div class="swatch"><div class="chip" style="background:#f1ebde"></div><div class="name">bg</div><div class="hex">#f1ebde</div></div>
  <div class="swatch"><div class="chip" style="background:#fbf6e9"></div><div class="name">surface</div><div class="hex">#fbf6e9</div></div>
  <div class="swatch"><div class="chip" style="background:#e9e0cb"></div><div class="name">surface‑2</div><div class="hex">#e9e0cb</div></div>
  <div class="swatch"><div class="chip" style="background:#d8cfb6"></div><div class="name">line</div><div class="hex">#d8cfb6</div></div>
  <div class="swatch"><div class="chip" style="background:#beb295"></div><div class="name">line‑2</div><div class="hex">#beb295</div></div>
</div>
</div></body></html>
