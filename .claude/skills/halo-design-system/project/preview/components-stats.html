<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Stats row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:0;}
.row{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.cell{text-align:center;padding:14px 8px;border-right:1px solid var(--line);}
.cell:last-child{border-right:0;}
.big{font-family:var(--font-serif);font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1;color:var(--ink);}
.small{font-family:var(--font-mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;}</style></head>
<body><div class="wrap">
<div class="row">
  <div class="cell"><div class="big">#16</div><div class="small">ATP WORLD</div></div>
  <div class="cell"><div class="big">#3</div><div class="small">ITALY</div></div>
  <div class="cell"><div class="big">0</div><div class="small">TITLES</div></div>
</div>
</div></body></html>
