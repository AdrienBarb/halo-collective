<!doctype html>
<html><head><meta charset="utf-8"><title>Color · Match results</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);}
  .wrap{padding:18px 20px;font-family:var(--font-sans);}
  .row{display:flex;gap:14px;align-items:center;}
  .badge{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-mono);font-weight:700;font-size:18px;}
  .col{display:flex;flex-direction:column;gap:4px;}
  .name{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);}
  .grp{display:flex;align-items:center;gap:10px;}
</style></head><body><div class="wrap">
<div class="row" style="gap:28px;">
  <div class="grp"><div class="badge" style="background:#2e7d32">W</div><div class="col"><div class="name">win</div><div class="hex">#2e7d32</div></div></div>
  <div class="grp"><div class="badge" style="background:#7a1f1f">L</div><div class="col"><div class="name">loss</div><div class="hex">#7a1f1f</div></div></div>
  <div class="grp"><div class="badge" style="background:#beb295;font-size:10px;letter-spacing:.08em;">BYE</div><div class="col"><div class="name">bye</div><div class="hex">#beb295</div></div></div>
</div>
</div></body></html>
