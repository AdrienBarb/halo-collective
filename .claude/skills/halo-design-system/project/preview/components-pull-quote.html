<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Pull quote</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:18px 20px;}
.q{border-left:3px solid var(--accent);padding:6px 0 6px 14px;}
.src{font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;}
.txt{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:15px;line-height:1.4;letter-spacing:-.005em;color:var(--ink);margin:0;}</style></head>
<body><div class="wrap">
  <div class="q">
    <div class="src">L'ÉQUIPE · 24 APR</div>
    <p class="txt">“Cobolli n'a pas tremblé sur la terre du Country Club — un set qui dit beaucoup de la suite.”</p>
  </div>
</div></body></html>
