<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:24px 20px;display:flex;flex-direction:column;gap:18px;}
.row{display:flex;align-items:center;gap:24px;}
.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);min-width:48px;}
.dark{background:var(--ink);padding:12px 16px;border-radius:8px;}
.dark .halo{color:#f1ebde;}.dark .collective{color:#beb295;}
.lg .halo{font-size:24px;}.lg .collective{font-size:13px;letter-spacing:.18em;}
.sm .halo{font-size:14px;}.sm .collective{font-size:8px;}</style></head>
<body><div class="wrap">
  <div class="row"><span class="lab">LG</span><span class="wordmark lg"><span class="halo">HALO</span><span class="collective">COLLECTIVE</span></span></div>
  <div class="row"><span class="lab">MD</span><span class="wordmark"><span class="halo">HALO</span><span class="collective">COLLECTIVE</span></span></div>
  <div class="row"><span class="lab">SM</span><span class="wordmark sm"><span class="halo">HALO</span><span class="collective">COLLECTIVE</span></span></div>
  <div class="row"><span class="lab">DARK</span><span class="wordmark dark"><span class="halo">HALO</span><span class="collective">COLLECTIVE</span></span></div>
</div></body></html>
