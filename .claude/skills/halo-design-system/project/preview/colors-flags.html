<!doctype html>
<html><head><meta charset="utf-8"><title>Color · Flag accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);}
  .wrap{padding:14px 20px;font-family:var(--font-sans);}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .athlete{}
  .stripe{display:flex;height:8px;border-radius:3px;overflow:hidden;border:1px solid var(--line);}
  .stripe>div{flex:1;}
  .name{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-top:8px;}
  .country{font-family:var(--font-sans);font-size:11px;color:var(--ink-3);margin-top:2px;}
</style></head><body><div class="wrap">
<div class="row">
  <div class="athlete"><div class="stripe"><div style="background:#009246"></div><div style="background:#fff"></div><div style="background:#ce2b37"></div></div><div class="name">🇮🇹 ITA</div><div class="country">Cobolli</div></div>
  <div class="athlete"><div class="stripe"><div style="background:#fff"></div><div style="background:#b8001f"></div></div><div class="name">🇵🇱 POL</div><div class="country">Świątek</div></div>
  <div class="athlete"><div class="stripe"><div style="background:#002395"></div><div style="background:#fff"></div><div style="background:#ed2939"></div></div><div class="name">🇫🇷 FRA</div><div class="country">Rinderknech</div></div>
  <div class="athlete"><div class="stripe"><div style="background:#009dbf"></div><div style="background:#f5c500"></div></div><div class="name">🇰🇿 KAZ</div><div class="country">Bublik</div></div>
  <div class="athlete"><div class="stripe"><div style="background:#1a1a1a"></div><div style="background:#ffd100"></div><div style="background:#ef3340"></div></div><div class="name">🇧🇪 BEL</div><div class="country">Mertens</div></div>
</div>
</div></body></html>
