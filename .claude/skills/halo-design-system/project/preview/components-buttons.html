<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;}</style></head>
<body><div class="wrap">
  <div><div class="lab">Primary · ink</div><button class="btn-primary" style="width:100%;">Get future editions in your inbox →</button></div>
  <div style="display:flex;gap:10px;align-items:center;"><div class="lab" style="min-width:64px;">Action</div><button class="btn-action">▶ Watch highlights →</button><button class="btn-action">Submit my vote</button></div>
  <div style="display:flex;gap:10px;align-items:center;"><div class="lab" style="min-width:64px;">Disabled</div><button class="btn-action" style="opacity:.5;cursor:not-allowed;">Submit my vote</button></div>
</div></body></html>
