<!doctype html>
<html><head><meta charset="utf-8"><title>Color · Accent &amp; action</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);}
  .wrap{padding:18px 20px;font-family:var(--font-sans);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .swatch{display:flex;flex-direction:column;gap:8px;}
  .chip{height:78px;border-radius:8px;}
  .name{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);}
  .role{font-family:var(--font-sans);font-size:11px;color:var(--ink-2);}
</style></head><body><div class="wrap">
<div class="row">
  <div class="swatch"><div class="chip" style="background:#c8932e"></div><div class="name">accent</div><div class="hex">#c8932e</div><div class="role">Eyebrows, gold top stripe</div></div>
  <div class="swatch"><div class="chip" style="background:#5ba9d8"></div><div class="name">action</div><div class="hex">#5ba9d8</div><div class="role">All CTAs — single brand action color</div></div>
  <div class="swatch"><div class="chip" style="background:#1e2d4a"></div><div class="name">banner‑bg</div><div class="hex">#1e2d4a</div><div class="role">Module-header navy</div></div>
  <div class="swatch"><div class="chip" style="background:#5b7a3f"></div><div class="name">ok</div><div class="hex">#5b7a3f</div><div class="role">Win / positive olive</div></div>
</div>
</div></body></html>
