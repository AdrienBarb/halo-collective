<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Voice note</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:18px 20px;}
.player{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;}
.play{width:42px;height:42px;border-radius:50%;background:var(--action);color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.eyebrow{font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);}
.title{font-family:var(--font-serif);font-weight:500;font-size:14px;color:var(--ink);margin-top:2px;}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:6px;}
.bar{width:2px;border-radius:1px;background:var(--ink-3);}
.bar.on{background:var(--action);}</style></head>
<body><div class="wrap">
  <div class="player">
    <button class="play">▶</button>
    <div style="flex:1;min-width:0;">
      <div class="eyebrow">VOICE NOTE · 1:30 · 22 APR</div>
      <div class="title">Coming next: Munich preview</div>
      <div class="bars">
        <div class="bar on" style="height:7px"></div><div class="bar on" style="height:11px"></div><div class="bar on" style="height:14px"></div><div class="bar on" style="height:9px"></div><div class="bar on" style="height:16px"></div><div class="bar on" style="height:13px"></div><div class="bar" style="height:10px"></div><div class="bar" style="height:8px"></div><div class="bar" style="height:14px"></div><div class="bar" style="height:11px"></div><div class="bar" style="height:9px"></div><div class="bar" style="height:13px"></div><div class="bar" style="height:7px"></div><div class="bar" style="height:15px"></div><div class="bar" style="height:11px"></div><div class="bar" style="height:9px"></div><div class="bar" style="height:12px"></div><div class="bar" style="height:8px"></div><div class="bar" style="height:14px"></div><div class="bar" style="height:10px"></div>
      </div>
    </div>
  </div>
</div></body></html>
