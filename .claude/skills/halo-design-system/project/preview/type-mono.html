<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Mono labels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;color:var(--ink-3);}</style></head>
<body><div class="wrap">
  <div><div class="lab">EYEBROW · 10 · 0.18em</div><div class="eyebrow">01 · MY DEBRIEF</div></div>
  <div><div class="lab">META · 9 · 0.18em</div><div class="meta">#03 · 22 APR 2026 · MONTE‑CARLO</div></div>
  <div><div class="lab">TINY · 8 · 0.22em</div><div class="tiny">PARTNERS</div></div>
  <div><div class="lab">CTA LABEL · 11 · 0.05em · 900</div><span style="font-family:var(--font-mono);font-weight:900;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);">Watch highlights →</span></div>
</div></body></html>
