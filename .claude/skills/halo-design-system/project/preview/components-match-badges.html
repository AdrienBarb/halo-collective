<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Match badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:center;gap:14px;}
.b{font-family:var(--font-mono);font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;border-radius:8px;}
.W{background:#2e7d32;width:26px;height:26px;font-size:12px;}
.L{background:#7a1f1f;width:26px;height:26px;font-size:12px;}
.B{background:#beb295;height:26px;padding:0 8px;font-size:9px;letter-spacing:.08em;color:#fff;}
.lab{font-family:var(--font-sans);font-size:13px;color:var(--ink);font-weight:600;}
.meta{margin-left:auto;}</style></head>
<body><div class="wrap">
  <div class="row"><div class="b W">W</div><div class="lab">Beat Khachanov</div><div class="meta">QF · 22 APR</div></div>
  <div class="row"><div class="b L">L</div><div class="lab">Lost to Sinner</div><div class="meta">SF · 24 APR</div></div>
  <div class="row"><div class="b B">BYE</div><div class="lab">First round bye</div><div class="meta">R64</div></div>
</div></body></html>
