<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#3d4759;background-image:linear-gradient(135deg,#3d4759 0%,#26303d 60%,#1a2030 100%);}
.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
.frosted{font-family:var(--font-mono);font-weight:500;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);padding:5px 10px;border-radius:999px;}
.frosted-dark{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.16);}
.row{display:flex;gap:10px;}</style></head>
<body><div class="wrap">
  <div class="row"><span class="frosted">★ MEMBER</span><span class="frosted">★ MEMBRE</span></div>
  <div class="row"><span class="frosted frosted-dark">#03 · 22 APR</span><span class="frosted frosted-dark">#12 · 06 MAY</span></div>
</div></body></html>
