<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Poll</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:14px 20px;}
.poll{border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;border:0;cursor:pointer;}
.opt:nth-child(even){background:#fff;}
.opt:last-child{border-bottom:0;}
.opt.sel{background:rgba(91,169,216,.12);}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dot.on{border-color:var(--action);background:var(--action);}
.dot.on::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff;}
.emo{font-size:16px;}
.lab{font-family:var(--font-sans);font-size:13px;color:var(--ink);flex:1;}
.btn{background:var(--action);color:#fff;font-family:var(--font-mono);font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:14px 20px;width:100%;border:0;cursor:pointer;margin-top:14px;}</style></head>
<body><div class="wrap">
<div class="poll">
  <button class="opt sel"><span class="dot on"></span><span class="emo">🟠</span><span class="lab">Madrid — back on clay</span></button>
  <button class="opt"><span class="dot"></span><span class="emo">🟢</span><span class="lab">Rome — home crowd</span></button>
  <button class="opt"><span class="dot"></span><span class="emo">🔴</span><span class="lab">Roland‑Garros — final boss</span></button>
</div>
<button class="btn">Submit my vote</button>
</div></body></html>
