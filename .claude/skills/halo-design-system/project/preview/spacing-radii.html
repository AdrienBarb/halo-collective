<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:18px 20px;}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end;}
.tile{background:var(--surface);border:1px solid var(--line);height:64px;}
.col{display:flex;flex-direction:column;gap:6px;align-items:center;}
.lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase;font-weight:600;}
.role{font-family:var(--font-sans);font-size:10px;color:var(--ink-3);text-align:center;line-height:1.3;}</style></head>
<body><div class="wrap">
<div class="row">
  <div class="col"><div class="tile" style="border-radius:4px;width:64px;"></div><div class="lab">4 · xs</div><div class="role">Action btns</div></div>
  <div class="col"><div class="tile" style="border-radius:8px;width:64px;"></div><div class="lab">8 · sm</div><div class="role">Inputs · video</div></div>
  <div class="col"><div class="tile" style="border-radius:10px;width:64px;"></div><div class="lab">10 · md</div><div class="role">Primary CTA</div></div>
  <div class="col"><div class="tile" style="border-radius:12px;width:64px;"></div><div class="lab">12 · lg</div><div class="role">Match cards</div></div>
  <div class="col"><div class="tile" style="border-radius:14px;width:64px;"></div><div class="lab">14 · xl</div><div class="role">Voice player</div></div>
  <div class="col"><div class="tile" style="border-radius:16px;width:64px;"></div><div class="lab">16 · 2xl</div><div class="role">Roster card</div></div>
</div>
</div></body></html>
