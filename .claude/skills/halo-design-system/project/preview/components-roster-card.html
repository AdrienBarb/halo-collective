<!doctype html>
<html><head><meta charset="utf-8"><title>Components · Roster card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--bg);}.wrap{padding:18px 20px;}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;}
.img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;object-position:center 15%;}
.stripe{display:flex;height:4px;}
.stripe>div{flex:1;}
.body{padding:12px 14px 14px;}
.name{font-family:var(--font-serif);font-weight:500;font-size:15px;letter-spacing:-.01em;line-height:1.1;color:var(--ink);}
.rank{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);font-weight:500;margin-top:4px;}</style></head>
<body><div class="wrap">
<div class="row">
  <div class="card">
    <img class="img" src="../assets/heroes/iga-swiatek.jpg" style="object-position:center 25%;">
    <div class="stripe"><div style="background:#fff"></div><div style="background:#b8001f"></div></div>
    <div class="body"><div class="name">Iga Świątek</div><div class="rank">WTA #4</div></div>
  </div>
  <div class="card">
    <img class="img" src="../assets/heroes/arthur-rinderknech.jpg" style="object-position:center 20%;">
    <div class="stripe"><div style="background:#002395"></div><div style="background:#fff"></div><div style="background:#ed2939"></div></div>
    <div class="body"><div class="name">Arthur Rinderknech</div><div class="rank">ATP #26</div></div>
  </div>
  <div class="card">
    <img class="img" src="../assets/heroes/alexander-bublik.jpg" style="object-position:center 10%;">
    <div class="stripe"><div style="background:#009dbf"></div><div style="background:#f5c500"></div></div>
    <div class="body"><div class="name">Alexander Bublik</div><div class="rank">ATP #11</div></div>
  </div>
</div>
</div></body></html>
